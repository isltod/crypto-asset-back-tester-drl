<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CABT DRL - Crypto Asset BackTester</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: #12161f;
      color: #e0e6ed;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background-color: #1a2130;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    h1 {
      color: #4f46e5;
      font-size: 1.8rem;
      margin-top: 0;
    }
    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      background-color: #10b981;
      color: #000;
      font-weight: bold;
      border-radius: 20px;
      font-size: 0.85rem;
    }
    .card {
      background-color: #242d3f;
      padding: 15px;
      border-radius: 8px;
      margin-top: 15px;
    }
    code {
      background-color: #0f172a;
      padding: 2px 6px;
      border-radius: 4px;
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 CABT DRL Data Manager <span class="status-badge">Running</span></h1>
    <p>Node.js 기반 바이낸스 선물 데이터 수집기 및 서버 셋업이 완료되었습니다.</p>
    
    <div class="card">
      <h3>📡 데이터 수집 API 테스트 엔드포인트</h3>
      <ul>
        <li><strong>데이터 수집 및 저장:</strong> <code>GET /api/data/fetch?symbol=BTCUSDT&interval=1h&limit=100</code></li>
        <li><strong>저장된 파일 목록:</strong> <code>GET /api/data/list</code></li>
        <li><strong>서버 헬스 체크:</strong> <code>GET /api/health</code></li>
      </ul>
    </div>
  </div>
</body>
</html>
